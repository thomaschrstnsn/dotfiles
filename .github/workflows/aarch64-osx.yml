name: "aarch64 macOS/darwin"
on:
  pull_request:
  push:
jobs:
  build-configuration:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Install Cachix
      uses: cachix/cachix-action@v17
      with:
        name: thomaschrstnsn
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Build Darwin configuration
      run: nix run nixpkgs#nh -- darwin build . -H aeris
