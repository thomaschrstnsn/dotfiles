[osd]
position = "bottom_center"

[shell]
font_family = "SF Pro Rounded"
polkit_agent = true
telemetry_enabled = true

    [shell.launcher]
    layout = "simple"

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    annotate = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 5.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "2"
    variant = "default"

