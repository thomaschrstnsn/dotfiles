[bar.default]
capsule = true
center = [ "media" ]
end = [ "tray", "clipboard", "bluetooth", "group:g1", "volume", "notifications", "session", "keyboard_layout", "clock" ]
font_family = "SF Pro Rounded"
font_weight = 600
start = [ "control-center", "launcher" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "temp", "cpu" ]
    opacity = 1.0
    padding = 6.0

